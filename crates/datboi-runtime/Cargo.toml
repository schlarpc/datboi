[package]
name = "datboi-runtime"
description = "wasmtime host for deterministic sandboxed transforms (datboi:transform world)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# wasmtime host traits speak anyhow (wasmtime::Result).
anyhow.workspace = true
datboi-core.workspace = true
thiserror.workspace = true
wasmtime.workspace = true

[dev-dependencies]
# Native twin of the committed component fixture: the ECM gate builds
# its vectors with the crate and asserts the WASM component agrees.
datboi-xf-ecm = { path = "../datboi-xf-ecm" }
# Same twin pattern for the XGD1 filler generator (D111): the gate
# generates the expected stream natively and asserts the component agrees.
datboi-xf-xgd1-prng = { path = "../datboi-xf-xgd1-prng" }
datboi-xf-gc-junk = { path = "../datboi-xf-gc-junk" }
# And the Wii partition crypto (D116): AES + SHA-1 tree, wasm vs native.
datboi-xf-wii-crypt = { path = "../datboi-xf-wii-crypt" }
blake3.workspace = true
wat.workspace = true

[lints]
workspace = true
