[package]
name = "datboi-xf-gc-junk"
description = "GameCube / Wii junk regeneration for the datboi:transform@1 world (D115): the mastering lagged-Fibonacci generator, reseeded every 32 KiB from the game ID, disc number and sector index, as a zero-input stream over a disc's address space — `fill {id, disc, len}` — positional, so any range is arithmetic; the same crate is the generator the analyzer verifies with natively"
version = "0.1.0"
edition = "2024"
authors = ["Chaz Schlarp"]
license = "MIT"
repository = "https://github.com/schlarpc/datboi"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
datboi-guest-transform = { path = "../datboi-guest-transform" }

# Standalone workspace ON PURPOSE (D54): each transform builds against its
# own lockfile so sibling crates can't perturb its bytes through shared
# dependency resolution — component identity must be reproducible from
# this directory alone (plus ../wit and ../datboi-guest-transform).
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Transforms are content-addressed artifacts: favor small, stable output.
# The generator is a few hundred XORs per 2 KiB; size wins over the last
# few percent, and the analyzer's native twin runs the rlib at full opt.
opt-level = "s"
lto = true
strip = true
