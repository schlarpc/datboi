[package]
name = "datboi-nfs-server"
version = "0.11.0"
edition = "2021"
license = "BSD-3-Clause"
description = "In-process userspace NFSv3 server — a vendored fork of nfsserve 0.11.0"
publish = false

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
byteorder = "1.4"
filetime = "0.2"
num-derive = "0.4"
num-traits = "0.2"
# Upstream's default-features=false set plus the workspace's; io-util and
# fs are upstream's, and features are additive, so asking for them here
# does not perturb anyone else's tokio.
tokio = { workspace = true, features = ["io-util", "fs"] }
tracing.workspace = true
