[package]
name = "datboi-xf-xgd1-prng"
description = "XGD1 filler regeneration for the datboi:transform@1 world (D111): the proprietary 32-bit-seeded mastering PRNG over GF(2^32-5) as a zero-input stream — `fill {seed, sectors}` — with an affine stream jump so any range is arithmetic; the same crate carries the meet-in-the-middle seed solver the analyzer runs natively"
version = "0.1.0"
edition = "2024"
authors = ["Chaz Schlarp"]
license = "MIT"
repository = "https://github.com/schlarpc/datboi"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
datboi-guest-transform = { path = "../datboi-guest-transform" }

# Standalone workspace ON PURPOSE (D54): each transform builds against its
# own lockfile so sibling crates can't perturb its bytes through shared
# dependency resolution — component identity must be reproducible from
# this directory alone (plus ../wit and ../datboi-guest-transform).
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Transforms are content-addressed artifacts: favor small, stable output.
# The solver is native-only hot code (the analyzer's rlib); the component
# ships the generator, where size wins over the last few percent.
opt-level = "s"
lto = true
strip = true
